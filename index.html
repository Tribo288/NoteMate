<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>NoteMate
</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    background: #f0f2f5;
}

/* Sidebar */
.sidebar {
    width: 220px;
    background: #004aad;
    color: white;
    padding: 20px 10px;
    box-sizing: border-box;
}
.sidebar div {
    padding: 15px;
    margin-bottom: 10px;
    cursor: pointer;
    font-size: 18px;
    border-radius: 8px;
    background: #0055d4;
    text-align: center;
}
.sidebar div:hover {
    background: #0070ff;
}

/* Main content */
.main {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* Box ghi âm */
.record-box {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    width: 65%;
    box-shadow: 0 0 8px #00000033;
    margin-bottom: 20px;
}
.record-box h2 {
    margin-top: 0;
}

/* Nút ghi âm */
.record-btn {
    background: #ff4d4d;
    color: white;
    padding: 8px 20px;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    font-weight: bold;
}

/* Danh sách audio */
.audio-list {
    margin-top: 15px;
    padding: 10px;
    background: #d0e4ff;
    border-radius: 8px;
    max-height: 180px;
    overflow-y: auto;
}

/* Popup chung */
.popup {
    width: 320px;
    height: 420px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 0 12px #00000033;
    position: fixed;
    right: 20px;
    bottom: 20px;
    display: none;
    flex-direction: column;
    z-index: 1000;
}
.popup header {
    padding: 10px;
    background: #0070ff;
    color: white;
    border-radius: 12px 12px 0 0;
    font-size: 18px;
    cursor: move;
    text-align: center;
}
.messages {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    font-size: 14px;
}
.input-area {
    display: flex;
    padding: 10px;
}
.input-area input, .input-area textarea {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
}
.input-area button {
    margin-left: 5px;
    padding: 8px 12px;
    background: #0070ff;
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

/* Note popup */
#notePopup {
    width: 400px;
    height: 300px;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    display: flex;
    flex-direction: column;
}
#notePopup textarea {
    flex: 1;
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    font-size: 15px;
    resize: none;
    box-sizing: border-box;
}
</style>
</head>
<body>

<div class="sidebar">
  <div onclick="openNote()">📝 Ghi chú</div>
  <div onclick="toggleChat()">💬 Chatbot</div>
  <div onclick="openGroupChat()">🌐 Cộng đồng</div>
</div>

<div class="main">
  <div class="record-box">
    <h2>Ghi âm</h2>
    <button class="record-btn">Bắt đầu ghi</button>
    <div class="audio-list"></div>
  </div>
</div>

<!-- Chatbot Popup -->
<div id="chatPopup" class="popup">
  <header>Chatbot</header>
  <div id="messages" class="messages"></div>
  <div class="input-area">
    <input id="msgInput" placeholder="Nhập tin nhắn..." />
    <button onclick="sendMessage()">Gửi</button>
  </div>
</div>

<!-- Group Chat Popup -->
<div id="groupChatPopup" class="popup">
  <header>Cộng đồng</header>
  <div id="groupMessages" class="messages"></div>
  <div class="input-area">
    <input id="groupMsgInput" placeholder="Nhập tin nhắn..." />
    <button onclick="sendGroupMessage()">Gửi</button>
  </div>
</div>

<!-- Note Popup -->
<div id="notePopup" class="popup" style="display:flex;">
  <header>Ghi chú</header>
  <textarea id="noteText" placeholder="Nhập văn bản..."></textarea>
</div>

<script>
// --- Kéo thả popup ---
function dragElement(elmnt) {
  const header = elmnt.querySelector('header');
  let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
  if(header) {
    header.style.cursor = 'move';
    header.onmousedown = dragMouseDown;
  }

  function dragMouseDown(e) {
    e.preventDefault();
    pos3 = e.clientX;
    pos4 = e.clientY;
    document.onmouseup = closeDrag;
    document.onmousemove = elementDrag;
  }

  function elementDrag(e) {
    e.preventDefault();
    pos1 = pos3 - e.clientX;
    pos2 = pos4 - e.clientY;
    pos3 = e.clientX;
    pos4 = e.clientY;
    elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
    elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
  }

  function closeDrag() {
    document.onmouseup = null;
    document.onmousemove = null;
  }
}

// Kích hoạt kéo thả cho popup
dragElement(document.getElementById("chatPopup"));
dragElement(document.getElementById("groupChatPopup"));
dragElement(document.getElementById("notePopup"));

// --- Note popup ---
function openNote(){document.getElementById("notePopup").style.display="flex";}

// --- Chat popup ---
function toggleChat(){
  const chat = document.getElementById("chatPopup");
  chat.style.display = (chat.style.display==="flex")?"none":"flex";
}

// --- Group chat offline ---
let userName = "";
const groupMessages = [];

function openGroupChat(){
  if(!userName) userName = prompt("Nhập tên của bạn:") || "Người dùng";
  const group = document.getElementById("groupChatPopup");
  group.style.display="flex";
  renderGroupMessages();
}

function sendGroupMessage(){
  const input = document.getElementById("groupMsgInput");
  const text = input.value.trim();
  if(!text) return;
  groupMessages.push({name:userName,text});
  input.value="";
  renderGroupMessages();
}

function renderGroupMessages(){
  const container = document.getElementById("groupMessages");
  container.innerHTML="";
  groupMessages.forEach(m=>{
    const div = document.createElement("div");
    div.innerHTML = `<strong>${m.name}:</strong> ${m.text}`;
    container.appendChild(div);
  });
  container.scrollTop = container.scrollHeight;
}

// --- Chatbot hardcoded offline ---
function sendMessage(){
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if(!text) return;
  addMessage("Bạn", text);
  input.value = "";
  const knowledge = {
    "xin chào": "Chào bạn! Tôi có thể giúp gì?",
    "bạn tên gì": "Tôi là Chatbot đơn giản.",
    "thời tiết": "Xin lỗi, tôi không thể dự đoán thời tiết.",
    "help": "Bạn có thể hỏi: 'Xin chào', 'Bạn tên gì', 'Thời tiết'."
  };
  const reply = knowledge[text.toLowerCase()] || "Xin lỗi, tôi không hiểu câu hỏi.";
  addMessage("Bot", reply);
}

function addMessage(sender,text){
  const m = document.createElement("div");
  m.innerHTML = `<strong>${sender}:</strong> ${text}`;
  const container = document.getElementById("messages");
  container.appendChild(m);
  container.scrollTop = container.scrollHeight;
}

// --- Ghi âm ---
let mediaRecorder;
let audioChunks = [];
const recordBtn = document.querySelector(".record-btn");
const audioList = document.querySelector(".audio-list");

recordBtn.addEventListener("click", async () => {
  if (recordBtn.textContent === "Bắt đầu ghi") {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: "audio/webm" });
      const url = URL.createObjectURL(blob);
      const audioEl = document.createElement("audio");
      audioEl.controls = true;
      audioEl.src = url;
      const li = document.createElement("div");
      li.style.marginBottom = "8px";
      li.appendChild(audioEl);
      audioList.appendChild(li);
    };
    mediaRecorder.start();
    recordBtn.textContent = "Dừng ghi";
  } else {
    mediaRecorder.stop();
    recordBtn.textContent = "Bắt đầu ghi";
  }
});
</script>

</body>
</html>
