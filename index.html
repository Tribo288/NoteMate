<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>NoteMate</title>
<style>
/* Giữ nguyên CSS giao diện DPE, ghi âm, ghi chú từ file trước */
body { margin:0; font-family:Arial,sans-serif; background:#e6f0ff; display:flex; }
.sidebar{width:220px;background:#004aad;color:white;height:100vh;padding:20px 10px;box-sizing:border-box;}
.sidebar div{padding:15px;margin-bottom:10px;cursor:pointer;font-size:18px;border-radius:8px;background:#0055d4;text-align:center;}
.sidebar div:hover{background:#0070ff;}
.main{flex:1;padding:20px;}
.record-box{background:#fff;padding:20px;border-radius:12px;width:65%;box-shadow:0 0 8px #00000033;}
.record-btn{background:#ff4d4d;color:white;padding:8px 20px;border:none;border-radius:18px;cursor:pointer;font-weight:bold;}
.audio-list{margin-top:15px;padding:10px;background:#d0e4ff;border-radius:8px;max-height:180px;overflow-y:auto;}
#chatPopup{width:320px;height:420px;background:white;border-radius:12px;box-shadow:0 0 12px #00000033;position:fixed;right:20px;bottom:20px;display:none;flex-direction:column;}
#chatPopup header{padding:10px;background:#0070ff;color:white;border-radius:12px 12px 0 0;font-size:18px;cursor:move;text-align:center;}
#messages{flex:1;padding:10px;overflow-y:auto;font-size:14px;}
#chatInput{display:flex;padding:10px;}
#chatInput input{flex:1;padding:8px;border-radius:8px;border:1px solid #ccc;}
#chatInput button{margin-left:5px;padding:8px 12px;background:#0070ff;border:none;color:white;border-radius:8px;cursor:pointer;}
#notePopup{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:400px;background:white;padding:20px;border-radius:12px;box-shadow:0 0 12px #00000033;display:none;cursor:move;}
#notePopup textarea{width:100%;height:200px;padding:10px;border-radius:8px;font-size:15px;resize:none;}
#notePopup .close-btn{margin-top:10px;padding:8px 12px;background:#0070ff;color:white;border:none;border-radius:8px;cursor:pointer;}
</style>
</head>
<body>
<div class="sidebar">
<div onclick="openNote()">📝 Ghi chú</div>
<div onclick="toggleChat()">💬 Chatbot</div>
<div onclick="alert('Chưa kết nối!')">🌐 Cộng đồng</div>
</div>

<div class="main">
<div class="record-box">
<h2>Ghi âm</h2>
<button id="recordBtn" class="record-btn">Bắt đầu ghi</button>
<div class="audio-list" id="audioList"></div>
</div>
</div>

<div id="chatPopup">
<header id="chatHeader">Chatbot Node Proxy</header>
<div id="messages"></div>
<div id="chatInput">
<input id="msgInput" placeholder="Nhập câu hỏi..."/>
<button onclick="sendMessage()">Gửi</button>
</div>
</div>

<div id="notePopup">
<h3>Ghi chú</h3>
<textarea id="noteText" placeholder="Nhập văn bản..."></textarea><br/>
<button class="close-btn" onclick="closeNote()">Đóng</button>
</div>

<script>
// Ghi âm
let mediaRecorder, chunks=[], isRecording=false;
document.getElementById("recordBtn").onclick = async function(){
  if(!isRecording){
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.start();
    isRecording = true;
    this.innerText="Dừng ghi";
    mediaRecorder.ondataavailable = e=>chunks.push(e.data);
    mediaRecorder.onstop = ()=>{
      const blob = new Blob(chunks,{type:"audio/webm"});
      chunks=[];
      const url = URL.createObjectURL(blob);
      const audio = document.createElement("audio");
      audio.controls=true;
      audio.src=url;
      document.getElementById("audioList").appendChild(audio);
    };
  } else {
    mediaRecorder.stop();
    isRecording=false;
    this.innerText="Bắt đầu ghi";
  }
};

// Chatbot fetch tới Node server
function toggleChat(){const chat=document.getElementById("chatPopup");chat.style.display=(chat.style.display==="flex"?"none":"flex");}
function addMessage(sender,text){const m=document.createElement("div");m.innerHTML=`<strong>${sender}:</strong> ${text}`;document.getElementById("messages").appendChild(m);const msgs=document.getElementById("messages");msgs.scrollTop=msgs.scrollHeight;}

async function sendMessage(){
  const input=document.getElementById("msgInput");
  const text=input.value.trim();
  if(!text) return;
  addMessage("Bạn",text);
  input.value="";
  addMessage("Bot","Đang trả lời...");
  try{
    const res=await fetch("http://localhost:3000/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});
    const data=await res.json();
    const msgs=document.getElementById("messages");
    if(msgs.lastChild.textContent.includes("Đang trả lời")) msgs.removeChild(msgs.lastChild);
    addMessage("Bot",data.reply);
  } catch(err){
    console.error(err);
    addMessage("Bot","Lỗi kết nối server.");
  }
}

// Note popup
function openNote(){document.getElementById("notePopup").style.display="block";}
function closeNote(){document.getElementById("notePopup").style.display="none";}

// Kéo thả popup
dragElement(document.getElementById("chatPopup"),document.getElementById("chatHeader"));
dragElement(document.getElementById("notePopup"));

function dragElement(elmnt,handle){handle=handle||elmnt;let pos1=0,pos2=0,pos3=0,pos4=0;handle.style.cursor='move';handle.onmousedown=dragMouseDown;
function dragMouseDown(e){e=e||window.event;e.preventDefault();pos3=e.clientX;pos4=e.clientY;document.onmouseup=closeDrag;document.onmousemove=elementDrag;}
function elementDrag(e){e=e||window.event;e.preventDefault();pos1=pos3-e.clientX;pos2=pos4-e.clientY;pos3=e.clientX;pos4=e.clientY;elmnt.style.top=(elmnt.offsetTop-pos2)+"px";elmnt.style.left=(elmnt.offsetLeft-pos1)+"px";}
function closeDrag(){document.onmouseup=null;document.onmousemove=null;}}
</script>
</body>
</html>
